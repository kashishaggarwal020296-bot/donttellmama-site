name: Build blog

# Rebuilds the blog automatically whenever someone adds or edits a Markdown
# post in blog-content/, or changes the shared layout/build script, and
# commits the generated pages straight back to main so Vercel redeploys.
#
# One-time setup this needs (done once by a repo admin, not per post):
#   Settings → Actions → General → Workflow permissions →
#   "Read and write permissions" must be selected, so this workflow is
#   allowed to push its generated commit back to the repo.

on:
  push:
    branches: [main]
    paths:
      - "blog-content/**"
      - "scripts/build_blog.py"
      - "templates/layout.html"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build blog pages
        run: python3 scripts/build_blog.py

      - name: Commit generated pages
        run: |
          git config user.name "dtm-blog-bot"
          git config user.email "actions@github.com"
          git add blog/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to blog/ — nothing to commit."
          else
            git commit -m "Rebuild blog from blog-content/ [skip ci]"
            git push
          fi
